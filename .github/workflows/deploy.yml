name: Deploy

# Runs on every push to main. The deploy job only starts after both test jobs pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-api:
    name: API tests against a migrated database
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply all migrations to a fresh database
        run: npm run migrate
        env:
          DATABASE_PATH: ci.db
      # The tests create their own in-memory database and apply the same migrations before running.
      - run: npm test

  test-web:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Render
    needs: [test-api, test-web]
    runs-on: ubuntu-latest
    steps:
      # Deploy hooks come from each Render service (Settings > Deploy Hook) and are stored as repo secrets.
      # The API container applies pending migrations on start (see Dockerfile).
      - name: Deploy API
        env:
          HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_API_DEPLOY_HOOK is not set, skipping"; exit 0; fi
          curl --fail --silent --show-error -X POST "$HOOK"
      - name: Deploy frontend
        env:
          HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_WEB_DEPLOY_HOOK is not set, skipping"; exit 0; fi
          curl --fail --silent --show-error -X POST "$HOOK"
